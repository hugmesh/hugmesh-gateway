name: Release

# Builds the gateway's container image and publishes it to
# ghcr.io/hugmesh/hugmesh-gateway. Mirrors the image-build step of this repo's
# .gitlab-ci.yml (build:image job), adapted from the in-cluster GitLab registry
# to GHCR. The be/fe/pki-gateway overlays build FROM an exact version of it.
#
# When it runs:
#   - push to main          -> image tags :main and :sha-<12>
#   - push of a tag v<VER>  -> image tags :<VER>, :beta and :sha-<12>, plus a
#                              GitHub prerelease (never marked latest).
#                              <VER> must equal <project><version> in pom.xml.
#   - workflow_dispatch     -> on main: same as a push to main; on a v* tag:
#                              same as that tag push (the re-run path).
#                              Anything else is refused by the version job.
# There is no pull_request trigger, and there must never be one: the publish
# jobs may run on the self-hosted runner (see runs-on below).
#
# A beta is never tagged :latest; only a final release (no '-' in the version)
# would move :latest, and none exists yet. A published :<VER> is never
# overwritten: raise the beta number in pom.xml and tag again.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/hugmesh/hugmesh-gateway

jobs:
  version:
    # Publish jobs use the self-hosted runner (vars.RUNS_ON_PUBLISH, a JSON
    # array of labels) only for main, v* tags and studio-v* tags, and never
    # for a pull_request event. Everything else, or an unset variable, runs on
    # hosted ubuntu-latest. Deleting RUNS_ON_PUBLISH is the off switch.
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
      sha12: ${{ steps.v.outputs.sha12 }}
      commons_version: ${{ steps.v.outputs.commons_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, so a tag run can check that the tagged commit is on main.
          fetch-depth: 0

      - name: Read and check the version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f pom.xml ]; then
            echo "::error::pom.xml is missing"
            exit 1
          fi
          # <project><version> is the version source. Only DIRECT children of
          # <project> are read: the <parent> block carries its own <version>
          # (spring-boot-starter-parent), which must never be mistaken for ours.
          fields=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          root = ET.parse('pom.xml').getroot()
          v = root.find('m:version', ns)
          version = ((v.text or '') if v is not None else '').strip()
          commons = ''
          for d in root.findall('m:dependencies/m:dependency', ns):
              if (d.findtext('m:groupId', '', ns).strip() == 'net.hugmesh'
                      and d.findtext('m:artifactId', '', ns).strip() == 'hugmesh-commons'):
                  commons = d.findtext('m:version', '', ns).strip()
          print(version or '-', commons or '-')
          PY
          )
          read -r version commons_version <<<"$fields"
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::pom.xml version '$version' is not MAJOR.MINOR.PATCH[-pre] (no +build metadata)"
            exit 1
          fi
          case "$version" in
            *SNAPSHOT*)
              echo "::error::pom.xml version '$version' is a SNAPSHOT; published versions never are"
              exit 1
              ;;
          esac
          if ! [[ "$commons_version" =~ $semver ]] || [[ "$commons_version" == *SNAPSHOT* ]]; then
            echo "::error::the net.hugmesh:hugmesh-commons pin in pom.xml ('$commons_version') must be a literal, published, non-SNAPSHOT version"
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            pull_request|pull_request_target)
              echo "::error::a pull request never publishes"
              exit 1
              ;;
          esac
          case "$GITHUB_REF" in
            refs/tags/v*)
              if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match pom.xml version $version (expected v$version)"
                exit 1
              fi
              # A release is cut from main only: a tag on an unmerged commit is refused.
              if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
                echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main; tag a commit on main"
                exit 1
              fi
              kind=release
              ;;
            refs/heads/main)
              kind=main
              ;;
            *)
              echo "::error::refusing to publish from $GITHUB_REF: only main and v<version> tags publish"
              exit 1
              ;;
          esac
          sha12=${GITHUB_SHA:0:12}
          {
            echo "version=$version"
            echo "kind=$kind"
            echo "sha12=$sha12"
            echo "commons_version=$commons_version"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version kind=$kind sha12=$sha12 commons=$commons_version"

  image:
    needs: version
    # Signed publish job: always a GitHub-hosted runner. Nothing built on a
    # self-hosted runner (the operator's own host) may be published, so this
    # job deliberately does not use RUNS_ON_PUBLISH.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      SHA12: ${{ needs.version.outputs.sha12 }}
      COMMONS_VERSION: ${{ needs.version.outputs.commons_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PREFLIGHT - CROSS-REPO PACKAGE READ. The image build resolves net.hugmesh:
      # hugmesh-commons and its parent net.hugmesh:hugmesh-parent, published from OTHER
      # repositories. secrets.GITHUB_TOKEN is scoped to this repository and cannot read
      # them, so the read credential is the operator's read:packages PAT, the secret
      # PACKAGES_READ_TOKEN (operator decision 90a=B). Without this step a missing token
      # surfaces ten minutes later as "Could not find artifact net.hugmesh:hugmesh-commons
      # ... in central", which reads like "not published".
      # A 200 proves this credential can read that registry. The step then also checks
      # that the hugmesh-commons version pinned in pom.xml is listed there, so a gateway
      # built before its commons beta is published fails here, in seconds.
      - name: Preflight, cross-repo package read
        env:
          UPSTREAM_PACKAGES_ACTOR: ${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          UPSTREAM_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN != '' }}
        shell: bash
        run: |
          set -uo pipefail
          if [ "${HAS_PACKAGES_READ_TOKEN}" = "true" ]; then
            echo "read credential: secrets.PACKAGES_READ_TOKEN (operator-held PAT)"
          else
            echo "read credential: the automatic secrets.GITHUB_TOKEN, because the PACKAGES_READ_TOKEN"
            echo "secret is not set. It cannot read another repository's package; expect the probe below to fail."
          fi
          meta_dir=$(mktemp -d)
          rc=0
          for upstream in hugmesh-parent hugmesh-commons; do
            url="https://maven.pkg.github.com/hugmesh/${upstream}/net/hugmesh/${upstream}/maven-metadata.xml"
            code=$(curl -sS -o "${meta_dir}/${upstream}.xml" -w '%{http_code}' -u "${UPSTREAM_PACKAGES_ACTOR}:${UPSTREAM_PACKAGES_TOKEN}" "${url}" || echo 000)
            case "${code}" in
              200)
                echo "  readable    hugmesh/${upstream}"
                ;;
              401|403)
                echo "::error::CANNOT AUTHENTICATE to hugmesh/${upstream} (HTTP ${code}). This is NOT 'the upstream is unpublished'. Fix: set the PACKAGES_READ_TOKEN repo secret (classic PAT, read:packages), or share the org secret of that name with this repository."
                rc=1
                ;;
              404)
                echo "::error::NOT READABLE at hugmesh/${upstream} (HTTP 404). Two causes look identical: (a) nothing is published to that registry yet - run that repo's Release workflow first (order: build-config, parent, commons); (b) it is published but this credential cannot see it, because GitHub masks an unauthorised read of a private package as 404 (the usual cause is a missing PACKAGES_READ_TOKEN secret). Check the package page before re-publishing anything."
                rc=1
                ;;
              *)
                echo "::error::unexpected HTTP ${code} from hugmesh/${upstream}. Not classified - do not assume 'unpublished'."
                rc=1
                ;;
            esac
          done
          if [ "${rc}" -eq 0 ]; then
            if grep -aF -- "<version>${COMMONS_VERSION}</version>" "${meta_dir}/hugmesh-commons.xml" >/dev/null; then
              echo "  published   net.hugmesh:hugmesh-commons:${COMMONS_VERSION}"
            else
              echo "::error::net.hugmesh:hugmesh-commons:${COMMONS_VERSION} (the pin in pom.xml) is not listed in the registry's maven-metadata.xml. Publish hugmesh-commons v${COMMONS_VERSION} from its own tag first (chain order: build-config, parent, commons, auth-core, gateway)."
              rc=1
            fi
          fi
          exit ${rc}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        if: needs.version.outputs.kind == 'release'
        shell: bash
        run: |
          set -uo pipefail
          rc=0
          out=$(docker buildx imagetools inspect "$IMAGE_NAME:$VERSION" 2>&1) || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::$IMAGE_NAME:$VERSION already exists; a published version is never overwritten. Raise the beta number in pom.xml and tag again."
            exit 1
          fi
          if grep -Eqi 'not found|manifest unknown|name unknown' <<<"$out"; then
            echo "$IMAGE_NAME:$VERSION is not published yet; continuing"
          else
            echo "::error::could not tell whether $IMAGE_NAME:$VERSION exists (refusing rather than risk an overwrite):"
            echo "$out"
            exit 1
          fi

      - name: Work out the image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          if [ "$KIND" = release ]; then
            case "$VERSION" in
              # A beta (any pre-release) moves :beta and never :latest.
              *-*) channel=beta ;;
              # Only a final release (no '-') may move :latest.
              *) channel=latest ;;
            esac
            tags="$IMAGE_NAME:$VERSION,$IMAGE_NAME:$channel,$IMAGE_NAME:sha-$SHA12"
            label_version="$VERSION"
          else
            tags="$IMAGE_NAME:main,$IMAGE_NAME:sha-$SHA12"
            label_version=main
          fi
          # Belt and braces: :latest only ever goes with a final release.
          if [[ ",$tags," == *":latest,"* ]]; then
            if [ "$KIND" != release ] || [[ "$VERSION" == *-* ]]; then
              echo "::error::refusing to push a :latest tag for $KIND $VERSION"
              exit 1
            fi
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "label_version=$label_version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        env:
          # No build-record upload: it is a separate artifact upload that can fail the job
          # after a successful push, and nothing here reads it.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          build-args: |
            UPSTREAM_PACKAGES_ACTOR=${{ secrets.PACKAGES_READ_ACTOR || github.actor }}
          # BuildKit secret, mounted only for the two mvnw RUN steps (see Dockerfile).
          secrets: |
            packages_read_token=${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.label_version }}
            org.opencontainers.image.revision=${{ github.sha }}

      # --- signed-images-20261021 ---
      # Everything below signs what the step `build` just pushed, by DIGEST, from
      # this GitHub-hosted job: a cosign keyless signature (Sigstore, GitHub OIDC),
      # a SLSA build-provenance attestation and an SPDX SBOM attestation, both
      # pushed next to the image. A run that skipped the build (existing release
      # tag) skips all of it.
      - name: Resolve the pushed image name and digest
        id: signref
        if: steps.build.outcome == 'success'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, sys
          meta = json.loads(os.environ.get("METADATA") or "{}")
          digest = os.environ.get("DIGEST", "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              sys.exit(f"::error::build step gave no usable digest: {digest!r}")
          names = [n.strip() for n in meta.get("image.name", "").split(",") if n.strip()]
          repos, tags = set(), []
          for n in names:
              head, _, last = n.rpartition("/")
              if ":" in last:
                  last, tag = last.split(":", 1)
                  tags.append(tag)
              repos.add(f"{head}/{last}")
          if len(repos) != 1:
              sys.exit(f"::error::expected one pushed repository, got {sorted(repos)}")
          if "latest" in tags:
              sys.exit("::error::a :latest tag was pushed; beta images must never be tagged latest")
          repo = repos.pop()
          if repo != repo.lower() or not repo.startswith("ghcr.io/hugmesh/"):
              sys.exit(f"::error::unexpected image repository {repo!r}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"repo={repo}\ndigest={digest}\n")
          print(f"signing {repo}@{digest} (tags: {', '.join(tags)})")
          PY

      - name: Install cosign
        if: steps.signref.outcome == 'success'
        uses: sigstore/cosign-installer@v3

      - name: Sign the image digest (cosign keyless, GitHub OIDC)
        if: steps.signref.outcome == 'success'
        env:
          REF: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          push-to-registry: true

      - name: Generate an SPDX SBOM of the pushed digest
        if: steps.signref.outcome == 'success'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.signref.outputs.repo }}@${{ steps.signref.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest the SBOM (pushed to the registry)
        if: steps.signref.outcome == 'success'
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ steps.signref.outputs.repo }}
          subject-digest: ${{ steps.signref.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - name: Write the verify commands to the job summary
        if: steps.signref.outcome == 'success'
        env:
          REPO_IMAGE: ${{ steps.signref.outputs.repo }}
          DIGEST: ${{ steps.signref.outputs.digest }}
        run: |
          {
            echo "### Signed image"
            echo '```'
            echo "$REPO_IMAGE@$DIGEST"
            echo "cosign verify $REPO_IMAGE@$DIGEST --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/(heads/main|tags/v.*)\$'"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY"
            echo "gh attestation verify oci://$REPO_IMAGE@$DIGEST --repo $GITHUB_REPOSITORY --predicate-type https://spdx.dev/Document/v2.3"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: [version, image]
    if: needs.version.outputs.kind == 'release'
    runs-on: ${{ fromJSON(github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/studio-v')) && vars.RUNS_ON_PUBLISH || '"ubuntu-latest"') }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
      COMMONS_VERSION: ${{ needs.version.outputs.commons_version }}
    steps:
      - name: Create the GitHub release (prerelease for a beta)
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; leaving it as it is"
            exit 0
          fi
          prerelease=()
          case "$VERSION" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            "${prerelease[@]}" \
            --latest=false \
            --title "$GITHUB_REF_NAME" \
            --notes "Image: $IMAGE_NAME:$VERSION. Built against net.hugmesh:hugmesh-commons:$COMMONS_VERSION."

  # --- signed-images-20261021 ---
  # After the GitHub Release of a v<version> tag run, ask hugmesh.github.io to
  # rebuild its downloads data (contract: .wf-scripts results downloads/
  # DISPATCH-CONTRACT.md). The payload is informational; the site re-reads
  # GitHub itself. Needs the SITE_DISPATCH_TOKEN secret (a token allowed to
  # write contents on hugmesh/hugmesh.github.io); without it this job prints a
  # notice and succeeds. Never runs on a push to main.
  notify-site:
    needs: [github-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Notify hugmesh.github.io (repository_dispatch releases-updated)
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::SITE_DISPATCH_TOKEN is not set; skipping the hugmesh.github.io releases-updated notification"
            exit 0
          fi
          payload=$(python3 -c 'import json, os; print(json.dumps({"event_type": "releases-updated", "client_payload": {"source": os.environ["GITHUB_REPOSITORY"], "kind": "image", "version": os.environ["GITHUB_REF_NAME"][1:], "ref": os.environ["GITHUB_REF"], "sha": os.environ["GITHUB_SHA"]}}))')
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/hugmesh/hugmesh.github.io/dispatches \
            -d "$payload"
          echo "sent releases-updated for $GITHUB_REPOSITORY $GITHUB_REF_NAME"
